name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  javascript:
    name: Format, types, lint, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check 'src/**/*.{ts,tsx}' 'App.tsx' '__tests__/**/*.{ts,tsx}'
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec eslint . --quiet
      - run: pnpm test --runInBand --watch=false

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pnpm install --frozen-lockfile
      - run: ./gradlew :app:assembleDebug --no-daemon
        working-directory: android

  ios:
    name: iOS simulator build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: pnpm install --frozen-lockfile
      - run: bundle exec pod install --project-directory=ios
      - run: xcodebuild -workspace ios/melhem.xcworkspace -scheme melhem -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
